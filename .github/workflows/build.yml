name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Move files to Android directories
        run: |
          mkdir -p app/src/main/java/com/app/betguru
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          if [ -f "MainActivity.kt" ]; then cp MainActivity.kt app/src/main/java/com/app/betguru/; fi
          if [ -f "AndroidManifest.xml" ]; then cp AndroidManifest.xml app/src/main/; fi
          if [ -f "activity_main.xml" ]; then cp activity_main.xml app/src/main/res/layout/; fi
          if [ -f "colors.xml" ]; then cp colors.xml app/src/main/res/values/; fi
          if [ -f "strings.xml" ]; then cp strings.xml app/src/main/res/values/; fi
          if [ -f "themes.xml" ]; then cp themes.xml app/src/main/res/values/; fi
          if [ -f "ic_launcher.xml" ]; then cp ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/; fi
          if [ -f "ic_launcher_round.xml" ]; then cp ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/; fi
          if [ -f "ic_launcher_background.xml" ]; then cp ic_launcher_background.xml app/src/main/res/drawable/; fi

          echo 'plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }' > app/build.gradle.kts
          echo 'android { namespace = "com.app.betguru"; compileSdk = 34; defaultConfig { applicationId = "com.app.betguru"; minSdk = 21; targetSdk = 34; versionCode = 1; versionName = "1.0.0" } buildTypes { release { isMinifyEnabled = false; signingConfig = signingConfigs.getByName("debug") } } compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } kotlinOptions { jvmTarget = "17" } }' >> app/build.gradle.kts
          echo 'dependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.appcompat:appcompat:1.6.1"); implementation("com.google.android.material:material:1.11.0"); implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"); implementation("androidx.webkit:webkit:1.10.0"); implementation("androidx.activity:activity-ktx:1.8.2") }' >> app/build.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
